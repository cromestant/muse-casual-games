# muse-games relay API — reverse proxy to the FastAPI service on 127.0.0.1:8001
# (runs as user `muse` via a systemd --user service; see relay-api.service).
# TLS is managed by Certbot: run `certbot --nginx -d relay.onthe1.app` once
# after placing this file, then `nginx -t && systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name relay.onthe1.app;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
