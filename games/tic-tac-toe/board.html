<div id="ttt" style="box-sizing:border-box;max-width:340px;margin:0 auto;padding:12px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:12px;box-shadow:var(--hatch-widget-shadow);">
  <div id="ttt-status" style="text-align:center;font-weight:600;color:var(--hatch-widget-text);margin-bottom:10px;min-height:1.4em;">Connecting…</div>
  <div id="ttt-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
  <div style="text-align:center;color:var(--hatch-widget-muted);font-size:12px;margin-top:10px;">Room __ROOM__ · you are __MARK__ · live from the relay</div>
</div>
<script>
(function(){
  var ROOM = "__ROOM__";
  var BASE = "__RELAY__";
  var ME = __SEAT__;
  var grid = document.getElementById("ttt-grid");
  var statusEl = document.getElementById("ttt-status");
  var state = window.hatchWidget.getState({selected: null});
  var lastSig = "";
  var cells = [];
  for (var i = 0; i < 9; i++) {
    (function(i){
      var b = document.createElement("button");
      b.style.cssText = "aspect-ratio:1/1;font-size:38px;font-weight:700;border-radius:10px;border:1px solid var(--hatch-widget-border);background:var(--hatch-widget-surface-muted);color:var(--hatch-widget-text);cursor:pointer;touch-action:manipulation;";
      b.addEventListener("click", function(){
        var s = window.hatchWidget.getState({selected: null});
        window.hatchWidget.setState({selected: i});
        paintSelection(i);
      });
      grid.appendChild(b);
      cells.push(b);
    })(i);
  }
  function paintSelection(sel){
    for (var i = 0; i < 9; i++) {
      cells[i].style.outline = (i === sel) ? "3px solid var(--hatch-widget-focus)" : "none";
    }
  }
  function winner(board){
    var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (var k = 0; k < L.length; k++) {
      var a=L[k][0], b=L[k][1], c=L[k][2];
      if (board[a] !== " " && board[a] === board[b] && board[b] === board[c]) return board[a];
    }
    return null;
  }
  function render(board, turn, win){
    var sig = board.join("") + turn + (win || "-");
    if (sig !== lastSig) {
      lastSig = sig;
      window.hatchWidget.setState({selected: null});
      state = {selected: null};
    } else {
      state = window.hatchWidget.getState({selected: null});
    }
    for (var i = 0; i < 9; i++) {
      cells[i].textContent = board[i] === " " ? "" : board[i];
      cells[i].style.color = board[i] === "X" ? "var(--hatch-widget-accent)" : "var(--hatch-widget-text)";
      var playable = !win && turn === ME && board[i] === " ";
      cells[i].style.cursor = playable ? "pointer" : "default";
      cells[i].style.opacity = playable ? "1" : "0.85";
    }
    paintSelection(state.selected);
    if (win === "X") statusEl.textContent = "You win!";
    else if (win === "O") statusEl.textContent = "Rival wins.";
    else if (board.indexOf(" ") === -1) statusEl.textContent = "Draw.";
    else if (turn === ME) statusEl.textContent = state.selected !== null ? "Sending your move…" : "Your move — tap a cell";
    else statusEl.textContent = "Rival's turn…";
  }
  function poll(){
    fetch(BASE + "/v0/rooms/" + ROOM + "/moves")
      .then(function(r){ return r.json(); })
      .then(function(data){
        var board = [" "," "," "," "," "," "," "," "," "];
        (data.moves || []).forEach(function(m){
          if (m.type === "place") board[m.payload.cell] = (m.seat === 0 ? "X" : "O");
        });
        render(board, (data.moves || []).length % 2, winner(board));
      })
      .catch(function(){ statusEl.textContent = "Reconnecting…"; });
  }
  document.addEventListener("hatch-widget-state", function(e){
    state = e.detail.state || {selected: null};
    paintSelection(state.selected);
    if (state.selected !== null && lastSig) {
      // re-derive status text cheaply on tap
    }
  });
  poll();
  setInterval(poll, 3000);
})();
</script>
